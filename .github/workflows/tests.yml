name: tests

on:
  push:
  pull_request:

# Sistemas soportados: Windows y Fedora. El trabajo en Ubuntu comprueba además
# la versión mínima de Python.
jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: semana_ingenieria
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # dentro de un contenedor, el servicio se alcanza por su nombre
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/semana_ingenieria
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y python3 python3-pip
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/pytest -q

  windows:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # La imagen de GitHub trae PostgreSQL instalado pero detenido (usuario postgres, clave root)
      - name: Iniciar PostgreSQL
        run: |
          $servicio = Get-Service -Name postgresql*
          Set-Service -InputObject $servicio -StartupType Manual
          Start-Service -InputObject $servicio
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: semana_ingenieria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/semana_ingenieria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Construye la imagen de los modelos para Fedora (docker/Dockerfile) y comprueba que
  # genera texto y vectores solo con procesador. Usa dos modelos muy pequeños para no
  # descargar los del proyecto, que pesan 3.7 GB.
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t semana-modelo docker
      - name: Arrancar el contenedor
        run: >-
          docker run -d --name semana-modelo -p 127.0.0.1:11434:11434
          -e MODELOS="all-minilm smollm2:135m" --memory 2g --cpus 2 semana-modelo
      - name: Esperar a que descargue los modelos de prueba
        run: |
          for intento in $(seq 1 120); do
            if docker logs semana-modelo 2>&1 | grep -q "^Listo"; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' semana-modelo)" != "true" ]; then break; fi
            sleep 2
          done
          docker logs semana-modelo
          exit 1
      - name: Generar texto y vectores
        run: |
          curl -fsS http://localhost:11434/api/generate -d '{"model": "smollm2:135m", "prompt": "Hola", "stream": false, "options": {"num_predict": 8}}' | tee generar.json
          grep -q '"done":true' generar.json
          curl -fsS http://localhost:11434/api/embed -d '{"model": "all-minilm", "input": "hola"}' | grep -q '"embeddings":\[\['
      - name: Datos de la imagen
        if: always()
        run: |
          docker exec semana-modelo cat /etc/fedora-release
          docker exec semana-modelo ls /usr/lib/ollama
          docker image inspect semana-modelo --format 'Tamaño de la imagen: {{.Size}} bytes'
          docker stats --no-stream --format 'Memoria en uso: {{.MemUsage}}' semana-modelo
          docker logs semana-modelo 2>&1 | tail -40
